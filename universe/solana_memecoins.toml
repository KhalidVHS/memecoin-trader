# Solana memecoin backtest universe
#
# The definition of the experiment. Committed deliberately: a backtest whose
# universe is re-derived at run time is not reproducible, and a universe
# scraped from today's leaderboard would exclude exactly the failures a
# backtest must see. Coins that have since faded are kept on purpose.
#
# Resolved 2026-09-21T02:57:23Z against DexScreener.
#
# Method, and why it is not the obvious one:
#   1. Start from a static, dated seed list of 38 established Solana
#      memecoin tickers (predominantly 2023-2024 launches).
#   2. Resolve each ticker to a MINT, then resolve the mint to a pool via
#      GET /latest/dex/tokens/{mint}. Mint-first is essential. The
#      /latest/dex/search endpoint cannot be trusted for resolution: for
#      PNUT and MYRO it returned impostor vault tokens reusing the ticker,
#      quoted in USDC, at $356M and $24M "liquidity" - crowding the real
#      token out of the result page entirely. Their signature is
#      liquidity/fdv ~= 1.00 (the whole supply sits in the one pool).
#      The real PNUT has 30 pools and a liquidity/fdv of 0.067.
#   3. Keep the deepest pool that is SOL-quoted, on a real AMM
#      (raydium/orca/meteora incl. CLMM+DLMM), created on or before the
#      2026-03-21 cutoff, with >= $250k liquidity.
#
# On liquidity_fdv_ratio: it is recorded, not filtered on. A ratio near 1.00
# at large absolute size means impostor. But a ratio ABOVE 1.0 can be
# genuine - SLERF (1.738) is the known case where the LP was burned, locking
# liquidity permanently above market cap. SLERF and MICHI (1.046) were both
# confirmed real by mint (16 and 5 independent pools). Filtering on the
# ratio alone would have silently dropped them.
#
# BONK resolves to a $293k orca/SOL pool, the same one the live config
# trades. Deeper BONK liquidity exists but is USDC-quoted and so outside
# this screen. Consistent with live, but it is a thin pool for the size of
# the token - relevant to price impact, flagged not fixed.
#
# BONK, WIF and POPCAT mints were cross-checked against config.toml
# [[coins]] and match exactly.

