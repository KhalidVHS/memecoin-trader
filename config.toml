# The only file you need to edit.

[portfolio]
starting_cash_usd = 1000.0

# Three Solana memecoins. `mint` addresses are verified live at startup against
# DexScreener — if one is wrong or the token has migrated pools, startup fails
# loudly rather than trading against a stale address.
[[coins]]
symbol = "BONK"
mint = "DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263"
# Terms searched for on Reddit when building the sentiment brief.
aliases = ["BONK", "bonkcoin"]

[[coins]]
symbol = "WIF"
mint = "EKpQGSJtjMFqKZ9KQanSqYXRcF8fBopzLHYxdM65zcjm"
aliases = ["WIF", "dogwifhat", "dogwifcoin"]

[[coins]]
symbol = "POPCAT"
mint = "7GCihgDB8fe6KNjn2MYtkzZcRjQy3t9GHdC8uHYmW2hr"
aliases = ["POPCAT", "popcat"]

[model]
name = "claude-opus-5"
# "low" | "medium" | "high" | "xhigh" | "max" — a knob, not a constant, and the
# largest single lever on what this costs, because it is thinking tokens that
# move. Set to xhigh deliberately: the evidence bundle rewards a model that
# reasons across three disagreeing streams, which is exactly what effort buys.
# The README's $180-250/month was measured at "high" — expect more here.
effort = "xhigh"
max_tokens = 8000
# Per-million-token prices, used only to report spend in `memetrader report`.
price_input_per_mtok = 5.0
price_output_per_mtok = 25.0
price_cache_read_per_mtok = 0.5
# Writing the cache costs 1.25x base input — you pay a premium once to pay 0.1x
# on every later tick. Worth stating as its own number rather than folding it
# into the input rate, because a prefix that keeps getting invalidated shows up
# as a large cache-write bill and nothing else would explain it.
price_cache_write_per_mtok = 6.25

[cadence]
fast_tick_seconds = 60       # mark the book, enforce stops — no model call
slow_tick_seconds = 900     # full LLM decision cycle (15 min)

[risk]
max_position_pct = 0.30      # of total book value
stop_loss_pct = 0.15         # forced exit at -15% from entry
min_trade_usd = 10.0
max_price_impact_pct = 3.0
max_snapshot_age_seconds = 90
min_liquidity_usd = 50_000.0
# No max-trades-per-day and no minimum hold time. Deliberate.

[execution]
# Fill realism. Defaults are researched, not invented — see README.
slippage_bps_fallback = 50.0      # used only when Jupiter is unreachable
gas_usd_per_swap = 0.21           # ~0.002 SOL; rises hard during congestion
failed_tx_rate = 0.06             # a failed swap still pays full gas
default_pool_fee_pct = 0.25       # when routePlan label is unrecognised

[execution.pool_fee_pct]
Raydium = 0.25
"Raydium CLMM" = 0.25
PumpSwap = 0.30
Pump = 0.30
Orca = 0.30
Whirlpool = 0.30
Meteora = 0.25
"Meteora DLMM" = 0.25

[data]
# DexScreener and GeckoTerminal are keyless. Jupiter uses lite-api.jup.ag
# unless JUPITER_API_KEY is set in the environment.
dexscreener_base = "https://api.dexscreener.com"
geckoterminal_base = "https://api.geckoterminal.com/api/v2"
jupiter_base = "https://lite-api.jup.ag"
jupiter_base_keyed = "https://api.jup.ag"
http_timeout_seconds = 15.0
candles_5m = 100             # enough history for EMA21 / BB20 / ATR14
candles_1h = 100

[sentiment]
enabled = true
# Deliberately *below* [cadence] slow_tick_seconds, so a decision tick always
# re-fetches and never reads this cache. That is not a dead setting: sentiment
# is fetched only from loop.evidence(), which the 15-min tick calls once — but
# which `status` and `once --dry-run` also call, and those get run
# interactively many times a minute. The TTL is a debounce for those, not a
# cost control for the loop.
#
# Raising it above the cadence would be the wrong trade, because a cache hit is
# lossy in a way "staleness in seconds" does not capture: _brief_from_cache
# returns top_posts=() — titles are never written to disk, see the Reddit API
# terms note in sentiment.py's docstring — so every hit silently strips the
# only qualitative evidence in this stream. And the headline number,
# mention_velocity_1h, is an acceleration; it is the single figure where ten
# minutes stale does the most damage. A miss is cheap by comparison: one sweep
# of the 5 subreddits below at <=6 paginated requests each, against a 100
# req/min budget. It also loses nothing durable — the hourly history behind the
# 7d z-score is persisted separately and is written back on every fetch.
cache_ttl_seconds = 600
lookback_hours = 24
baseline_days = 7            # window for the mention z-score
# Sweep comments as well as submissions. Submissions alone are too sparse to
# carry signal here — 23 BONK submissions across all five subreddits in the 90
# days to 2026-09-19, newest 14.7 days old, so a 24h window is almost always
# zero. Measured over the 24h ending 2026-09-20 00:13 UTC: 136 submissions
# against at least 1008 comments (7.4:1) and 103 unique authors against 498.
#
# Be clear about what that buys. Over that same window the matcher found 0/0/0
# mentions in submissions and 1/0/0 in comments — it is a 7.4x larger
# denominator, not 7.4x more signal. What it buys is a zero that means
# something: 1008 items read with no mention is a measurement, 136 is a sample.
#
# Costs roughly 2x the requests per sweep; set false to halve it back. Flipping
# this discards the affected symbols' hourly baselines, because a bucket
# counting submissions+comments is not comparable to one counting submissions.
include_comments = true
subreddits = [
    "CryptoCurrency",
    "CryptoMoonShots",
    "SatoshiStreetBets",
    "solana",
    "pumpfun",
]

[prompt]
# How many past decisions the model sees, one compressed line each.
decision_history = 10
